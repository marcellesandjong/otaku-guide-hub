<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Anime Plug — Discover, Review & Track Anime</title>
    <meta
      name="description"
      content="Your ultimate anime hub. Browse thousands of shows, read reviews, track airing schedules, and get personalized recommendations powered by MyAnimeList."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- Apple touch icon (home screen bookmark on iOS) -->
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA / theme color -->
    <meta name="theme-color" content="#1a0a2e" />
    <meta name="apple-mobile-web-app-title" content="Anime Plug" />
    <meta name="application-name" content="Anime Plug" />

    <!-- Open Graph (iMessage, Slack, Discord, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anime Plug" />
    <meta property="og:title" content="Anime Plug — Discover, Review & Track Anime" />
    <meta
      property="og:description"
      content="Your ultimate anime hub. Browse thousands of shows, read reviews, track airing schedules, and get personalized recommendations."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Anime Plug" />
    <meta
      name="twitter:description"
      content="Discover, review, and track anime — powered by MyAnimeList."
    />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
